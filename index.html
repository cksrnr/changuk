<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>통역 통화 · Korean Live Interpreter</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo">🗣️</span>
        <div>
          <h1>실시간 통역 통화</h1>
          <p class="sub">스피커폰으로 통화하면서 사용하세요</p>
        </div>
      </div>
      <button id="clearBtn" class="ghost-btn" title="대화 지우기">지우기</button>
    </header>

    <!-- 사용 안내 배너 -->
    <div id="hintBanner" class="hint">
      통화를 <b>스피커폰</b>으로 켠 뒤, 말하는 사람에 맞춰 아래 버튼을 누르세요.
      상대(영어)가 말할 땐 <b>영어 듣기</b>, 내가 말할 땐 <b>한국어 듣기</b>를 누릅니다.
    </div>

    <!-- 대화 로그 -->
    <main id="log" class="log" aria-live="polite"></main>

    <!-- 상태 표시 -->
    <div id="status" class="status">준비됨</div>

    <!-- 컨트롤 -->
    <section class="controls">
      <div class="mic-row">
        <button id="koBtn" class="mic-btn ko">
          <span class="flag">🇰🇷</span>
          <span class="label">한국어 듣기</span>
          <span class="sublabel">→ 영어로 번역</span>
        </button>
        <button id="enBtn" class="mic-btn en">
          <span class="flag">🇺🇸</span>
          <span class="label">English 듣기</span>
          <span class="sublabel">→ 한국어로 번역</span>
        </button>
      </div>

      <div class="options">
        <label class="switch">
          <input type="checkbox" id="autoSpeak" checked />
          <span>번역 결과 음성 읽기</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="continuous" />
          <span>연속 듣기(자동 재시작)</span>
        </label>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
